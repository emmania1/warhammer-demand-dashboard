# One-off re-check after the Tone Pro launch (24 Oct 2026): which discovered Shopify
# stockists list Base/Layer/Tone Pro as one product with per-colour quantities.
# Runs 26 Oct; 27–28 Oct are backup slots (GitHub sometimes drops scheduled runs)
# and skip if a post-launch scan already exists. Only runs in 2026.
# ~5 requests per store, ~150 stores, one request at a time per store.
name: Variant-format quantity scan

on:
  schedule:
    - cron: "0 9 26,27,28 10 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - id: guard
        name: Only 2026, and only if no post-launch scan yet
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$(date -u +%Y)" != "2026" ] || grep -qE "^2026-10-(2[5-9]|3[01])," data/variant_qty_scan.csv; then
              echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Skipping."; exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Scan
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install requests pandas
          python scripts/scan_variant_qty_stores.py

      - name: Commit results
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add data/variant_qty_scan.csv
          git diff --cached --quiet && exit 0
          git commit -m "Variant-format quantity scan $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
