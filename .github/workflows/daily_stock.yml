# Daily stock snapshot — GW.com (Algolia, 3 warehouses) + Element Games + all paint SKUs +
# independent online availability panel + GW's public store finder (stockist labels).
# Runs in the cloud so data keeps flowing when the laptop is asleep, then
# regenerates index.html and commits everything back to main. The Pages deploy
# (static.yml) is triggered by this workflow finishing.
#
# GitHub doesn't guarantee scheduled runs (the 07:15 slot was dropped on
# 2026-10-14), so a 13:15 backup slot runs only if today's data is missing.
name: Daily stock snapshot

on:
  schedule:
    - cron: "15 7 * * *"    # 07:15 UTC daily
    - cron: "15 13 * * *"   # 13:15 UTC backup — skips if the morning run already landed
  workflow_dispatch:
    inputs:
      panel:
        description: "Also take an independent online availability panel snapshot (manual run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        name: Skip backup slot if today's data already exists
        run: |
          today=$(date -u +%Y-%m-%d)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "15 13 * * *" ] \
             && grep -q "^$today," data/gw_stock_summary.csv; then
            echo "Morning run already landed for $today — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  snapshot:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: GW.com stock snapshot (Algolia)
        run: python scripts/fetch_gw_stock.py

      - name: Paint SKU stock snapshot (Tone Pro + core ranges)
        continue-on-error: true
        run: python scripts/fetch_gw_paint_stock.py

      - name: Store finder snapshot (daily — stockist labels change day to day)
        continue-on-error: true
        run: python scripts/fetch_gw_storefinder.py

      - name: Independent online availability panel (scheduled once PANEL_ENABLED=true; or manual with panel=true)
        if: vars.PANEL_ENABLED == 'true' || github.event.inputs.panel == 'true'
        continue-on-error: true
        run: python scripts/fetch_indie_paint_panel.py

      - name: Weekly product-page counts (each store on its own weekday; config/page_qty_stores.csv)
        if: vars.PAGE_QTY_ENABLED == 'true'
        continue-on-error: true
        run: python scripts/fetch_page_qty_weekly.py

      - name: Element Games stock snapshot (UK indie)
        continue-on-error: true
        run: python scripts/fetch_element_games_stock.py

      - name: Regenerate dashboard (index.html)
        continue-on-error: true
        run: NO_BROWSER=1 python scripts/generate_youtube_dashboard.py

      - name: Commit data + dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add data/gw_stock_daily.csv data/gw_stock_summary.csv data/element_games_stock_daily.csv \
                  data/gw_paint_stock_*.csv data/gw_paint_oos_episodes.csv data/gw_storefinder_*.csv \
                  data/indie_paint_panel_*.csv data/prev_run_snapshot.json index.html
          for f in data/page_qty_weekly.csv data/gw_paint_stock_regions_daily.csv data/gw_paint_stock_regions_summary.csv \
                   data/gw_paint_oos_episodes_regions.csv; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Daily stock snapshot $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
