# Daily stock snapshot — GW.com (Algolia) + Element Games + all paint SKUs.
# Weekly (Mondays) it also snapshots GW's public store finder.
# Runs in the cloud so data keeps flowing when the laptop is asleep.
# Commits the stock CSVs back to main. (Commits made with GITHUB_TOKEN
# don't trigger the Pages deploy; index.html is regenerated by the weekly run.)
name: Daily stock snapshot

on:
  schedule:
    - cron: "15 7 * * *"   # 07:15 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stock
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: GW.com stock snapshot (Algolia)
        run: python scripts/fetch_gw_stock.py

      - name: Paint SKU stock snapshot (Tone Pro + core ranges)
        continue-on-error: true
        run: python scripts/fetch_gw_paint_stock.py

      - name: Store finder snapshot (Mondays + manual runs)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            python scripts/fetch_gw_storefinder.py
          else
            echo "Not Monday — skipping store finder."
          fi

      - name: Independent online availability panel (off until PANEL_ENABLED=true)
        if: vars.PANEL_ENABLED == 'true'
        continue-on-error: true
        run: python scripts/fetch_indie_paint_panel.py

      - name: Element Games stock snapshot (UK indie)
        continue-on-error: true
        run: python scripts/fetch_element_games_stock.py

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add data/gw_stock_daily.csv data/gw_stock_summary.csv data/element_games_stock_daily.csv \
                  data/gw_paint_stock_*.csv data/gw_paint_oos_episodes.csv data/gw_storefinder_*.csv \
                  data/indie_paint_panel_*.csv
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Daily stock snapshot $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
